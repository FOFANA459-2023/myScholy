# MyScholy frontend CI/CD (React + Vite, deployed to Cloudflare Pages).
#
# Every push and PR: lint -> unit/component tests -> build -> security audit
# -> full-stack e2e (checks out the backend repo alongside this one).
# Deploys run ONLY on push to main, after every gate is green.
#
# Required repository configuration is documented in .github/DEPLOYMENT.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Frontend / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Frontend / unit + component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build:
    name: Frontend / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build with the production API base
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://myscholyscholarship-backend.onrender.com/api' }}
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  audit:
    name: Security / dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  # Full-stack e2e: Playwright drives the production build against the real
  # Django backend, checked out from its own repository as a sibling
  # directory (mirroring the local monorepo layout). The backend repo is
  # public, so no extra token is needed; the BACKEND_REPO variable exists
  # only as an override if the repo ever moves.
  e2e:
    name: End-to-end (Playwright, full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - name: Check out the backend repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPO || 'FOFANA459-2023/myScholyScholarship_Backend' }}
          path: backend
          # If the backend repo ever goes private, add a fine-grained PAT
          # with contents:read as the BACKEND_REPO_TOKEN secret.
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_PYTHON: python
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Deploys the exact bundle the pipeline built and tested - never a rebuild.
  # Runs only on push to main, and only when every gate (e2e included) is green.
  deploy:
    name: Deploy / Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, build, audit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Download the tested production bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'myscholy' }}
