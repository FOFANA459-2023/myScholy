<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>myScholy - Scholarships for students worldwide</title>
    <meta
      name="description"
      content="Discover fully funded scholarships, grants and opportunities from around the world. Search by country, degree level and deadline - free to browse, free to apply."
    />
    <meta name="theme-color" content="#0c4a6e" />

    <!-- Open Graph / social previews. For /scholarships/<slug> URLs the
         Pages Function in functions/scholarships/[slug].js rewrites these
         tags with the scholarship's own name and description, so crawlers
         (which never run the React app) still see a specific preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="myScholy" />
    <meta property="og:title" content="myScholy - Scholarships for students worldwide" />
    <meta
      property="og:description"
      content="Discover fully funded scholarships, grants and opportunities from around the world."
    />
    <meta property="og:url" content="https://myscholy.pages.dev/" />
    <meta property="og:image" content="https://myscholy.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Warm up the TLS handshake to the API before the first request fires. -->
    <link rel="preconnect" href="https://myscholy.duckdns.org" />
    <link rel="dns-prefetch" href="https://myscholy.duckdns.org" />
  </head>
  <body>
    <!-- The app has never used a service worker or the Cache API, but older
         deployments of this site may have registered one, and a leftover
         worker serves a frozen copy of the whole app that survives refreshes
         and every deploy (classic symptom: stale in normal Chrome, fine in
         incognito). Unconditionally unregister and clear on every boot. -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          })
          .catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches
          .keys()
          .then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          })
          .catch(function () {});
      }
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        myScholy needs JavaScript enabled to show the scholarship board.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
